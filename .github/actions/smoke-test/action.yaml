name: "Smoke test"
inputs:
  template:
    description: "Template to test"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      id: checkout_release
      uses: actions/checkout@v4

    - name: Build template
      id: build_template
      shell: bash
      # Only used to pre-fetch GitHub's published IP ranges at a higher rate
      # limit; it is not passed into the container.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/build.sh ${{ inputs.template }}

    - name: Test template
      id: test_template
      shell: bash
      run: ${{ github.action_path }}/test.sh ${{ inputs.template }}
